<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
<body>
    <!--
    sistema de grid do bootsrap usa 6 classes para definir o numero de 
    colunas em diferentes tamanhos de tela:

    .col - dispositivo extra pequeno - largura de tela inferior a 576px
    .col-sm - dispositivo pequenos - largura de tela superior a 576px
 .col-md - dispositivo medios - largura de tela superior a 768pxpx 
 .col-lg - dispositivo grandes - largura de tela superior a 992px
  .col-xl - dispositivo extra grande - largura de tela superior a 1200px
   .col-xll - dispositivo extra grande - largura de tela superior a 1400px

-->
<div class="container-fluid mt-3">
<h1>Grids</h1>
    <div class="row">
        <div class="col-sm-3 p-3 bg-primary text-white"> col-sm</div>
        <div class="col-sm-3 p-3 bg-dark text-white"> col-sm</div>
        <div class="col-sm-3 p-3 bg-primary text-white"> col-sm</div>
        <div class="col-sm-3 p-3 bg-dark text-white"> col-sm</div>
    
    </div>
<br>
    <div class="row">
        <div class="col-md-3 p-3 bg-primary text-white"> col-md</div>
        <div class="col-md-3 p-3 bg-dark text-white"> col-md</div>
        <div class="col-md-3 p-3 bg-primary text-white"> col-md</div>
        <div class="col-md-3 p-3 bg-dark text-white"> col-md</div>
    
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
