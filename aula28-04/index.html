<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="p-3 m-0 border-0 bd-example m-0 border-0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <form class="row g-3" action="receber.html" method="get">
        <div class="container">
            <h1>Formulário de Cadastro</h1>
            <br>
            <div class="formulario">
                <h3>Dados Pessoais kk</h3>
                <div class="row">
                    <div class="col-md-3">
                        <label for="inputNome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="inputNome">
                    </div>
                    <div class="col-md-3">
                        <label for="inputSobrenome" class="form-label">Sobrenome</label>
                        <input type="text" class="form-control" id="inputSobrenome">
                    </div>

                    <div class="col-md-1">
                        <label for="inputage" class="form-label">Idade</label>
                        <input type="text" class="form-control" id="inputage">
                    </div>
                    <br>
                    <h3>Contato</h3>
                    <div class="col-md-6">
                        <label for="inputEmail4" class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail4">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="autoSizingInputGroup">Telefone</label>
                        <div class="input-group">
                            <div class="input-group-text">+55</div>
                            <input type="text" class="form-control" id="autoSizingInputGroup"
                                placeholder="(00) 00000-0000">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </form>
    <br><br>



    </div>

</body>

</html>
