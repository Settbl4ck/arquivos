<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Eventos Escolares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Painel de Eventos Escolares</h1>
        <p>Cadastre e visualize os eventos da escola.</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Novo evento</h2>

            <label for="nome">Nome do evento</label>
            <input type="text" id="nome" placeholder="Digite o nome do evento">

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" placeholder="Ex: Cultural, Esportivo, Escolar">

            <label for="data">Data</label>
            <input type="date" id="data">

            <label for="descricao">Descrição</label>
            <textarea id="descricao" placeholder="Digite uma descrição para o evento"></textarea>

            <button type="button" id="cadastrar">
                Cadastrar evento
            </button>

            <p id="mensagem"></p>
        </section>

        <section class="eventos">
            <h2>Eventos cadastrados</h2>
            <div id="listaEventos"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
