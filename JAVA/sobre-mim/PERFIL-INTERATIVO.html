<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Interativo</title>
    <link rel="stylesheet" href="PERFIL-INTERATIVO.css">

</head>

<body>
    <h1>PERFIL INTERATIVO</h1>

    <div class="formulario">
        <h2>Editar Perfil</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="profissao">Profissão:</label>
        <input type="text" id="profissao" placeholder="Digite sua profissão">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Digite sua cidade">

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" placeholder="Digite uma descrição">

        <button id="atualizar">Atualizar Perfil</button>
    </div>

    <div class="perfil">
        <h2 id="nomeperfil">Nome do Usuário</h2>
        <p id="profissaoperfil">Profissão:</p>
        <p id="cidadeperfil">Cidade:</p>
        <p id="descricaoperfil">Descrição:</p>

    </div>

    <script src="PERFIL-INTERATIVO.js"></script>

</body>

</html>
