<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálago Interativo</title>
    <link rel="stylesheet" href="2909.css">
</head>

<body>
    <header>
        <h1>Catálago Interativo</h1>
        <p>Cadastre novos produtos utilizando JavaScript e DOM</p>
    </header>
    <main>
        <section class="formulario">
            <h2>Cadastrar Produtos</h2>
            <label for="nome">Nome do Produto</label>
            <input type="text" id="nome" placeholder="Digite o nome do produto">

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" placeholder="Digite a categoria">

            <label for="preço">Preço</label>
            <input type="number" id="preço" placeholder="Digite o preço">

            <label for="descrição">descrição</label>
            <textarea id="descrição" placeholder="Digite a descrição do produto"></textarea>

            <div class="botoes">
                <button type="button" id="visualizar">Visualizar</button>
                <button type="button" id="adicionar">Adicionar</button>
            </div>
            <p id="mensagemErro"></p>

        </section>
        <section class="previa">
            <h2>Pre-visualização</h2>
            <div class="card">
                <h3 id="visualizarNome">Nome do Produto</h3>
                <p id="visualizarCategoria">Categoria</p>
                <p id="visualizarPreco">R$ 0,00</p>
                <p id="visualizarDescricao">Descrição do Produto</p>
            </div>
        </section>

        <section class="catalogo">
            <h2>Produtos cadastrados</h2>
            <div id="listaItens"></div>
        </section>

    </main>
    <footer>
        <p>&copy 2026 - Catálago Interativo</p>
    </footer>
    <script src="2909.js"></script>
</body>

</html>
