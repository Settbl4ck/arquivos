<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Escolar 2026 - Inscrição</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="menu">
        <a href="index.html">Sobre</a>
        <a href="programacao.html">Programação</a>
        <a href="inscricao.html">Inscrição</a>
    </nav>

    <section class="secao">
        <h2>Formulário de Inscrição</h2>
        <form class="formulario" action="#" method="post">
            
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="turma">Turma:</label>
            <input type="text" id="turma" name="turma" placeholder="Ex: 1º Ano Sesc" required>

            <label for="participacao">Tipo de Participação:</label>
            <select id="participacao" name="participacao">
                <option value="visitante">Visitante</option>
                <option value="apresentador">Apresentador de projeto</option>
                <option value="participante">Participante de oficina</option>
                <option value="organizador">Organizador</option>
            </select>

            <label for="observacoes">Observações:</label>
            <textarea id="observacoes" name="observacoes" rows="4" placeholder="Alguma observação..."></textarea>

            <button type="submit" class="botao">Enviar Inscrição</button>
        </form>
    </section>

</body>
</html>
