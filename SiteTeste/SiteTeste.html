<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="SiteTeste.css">
  <title>Site Teste</title>
</head>

<body>

  <header>
    <h1>Site Teste</h1>
    <button class="btn-toggle" id="btnTheme">Alternar Tema</button>
  </header>

  <section class="hero">
    <h1>Estrutura Completa de Testes</h1>
    <h2>HTML5 Semântico + CSS Grid/Flexbox + Manipulação de DOM com JS</h2>
  </section>


  <main>
    <div class="grid-container">

      <article class="card">
        <div class="gallery-container">
          <h2>Minha Galeria Sequencial</h2>

          <!-- Imagem Principal -->
          <img id="fotoPrincipal" class="main-image" src="imagens/foto1.jpg" alt="Foto da Galeria">

          <!-- Botões de Navegação -->
          <div class="controls">
            <button id="btnAnterior">&larr; Anterior</button>
            <button id="btnProxima">Próxima &rarr;</button>
          </div>

          <!-- Contador Opcional -->
          <div id="contador" class="counter">Imagem 1 de 4</div>
        </div>
  </main>

  <footer>
    <p>Rodapé de Teste &copy; 2026 - Estrutura Responsiva</p>
  </footer>

  <script src="SiteTeste.js"></script>

</body>

</html>
