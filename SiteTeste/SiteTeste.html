<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="SiteTeste.css">
  <title>Site Teste</title>
</head>

<body>

  <header>
    <h1>Site Teste</h1>
    <button class="btn-toggle" id="btnTheme">Alternar Tema</button>
  </header>

  <section class="hero">
    <h1>Estrutura de Testes</h1>
    <h2>HTML + CSS +JS</h2>
  </section>

  <main>
    <div class="grid-container">


      <article class="card">
        <div>
          <img class="card-img" src="imagensfoto1.jpg" alt="Imagem do Card 1">
          <h3>Card Interativo (Contador)</h3>
          <p id="cardText">Teste para JavaScript</p>
        </div>
        <button class="btn-action" id="btnCurtir">Curtir (0)</button>
      </article>


      <article class="card">
        <div>
          <img id="fotoPrincipal" class="card-img" src="imagensfoto1.jpg" alt="Foto da Galeria">
          <h3>Galeria</h3>
          <p>Teste para JavaScript e CSS</p>
        </div>
        <div>
          <div class="controls">
            <button class="btn-action" id="btnAnterior">&larr; Anterior</button>
            <button class="btn-action" id="btnProxima">Próxima &rarr;</button>
          </div>
          <div id="contador" class="counter">Imagem 1 de 8</div>
        </div>
      </article>

    </div>
  </main>

  <footer>
    <p>Rodapé de Teste &copy; 2026 - Estrutura Responsiva</p>
  </footer>

  <script src="SiteTeste.js"></script>

</body>

</html>
