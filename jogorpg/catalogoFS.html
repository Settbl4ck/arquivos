<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes e Séries</title>
    <link rel="stylesheet" href="catalogoFS.css">
</head>

<body>

    <header>
        <h1>Catálogo de Filmes</h1>
        <p>Cadastre e Avalie seus Filmes e Séries favoritos!</p>
        <div class="headerbotoes">
            <button id="modo">◉ Modo Escuro</button>
            <button id="ocultarform"> – Ocultar Formulário</button>
        </div>
    </header>
    <section class="formulario">
    <h2>Cadastrar Novo Jogo</h2>
    <label for="selecione">Selecione</label><br>

     <p>Selecione</p>
  <input type="radio" id="opcao1" name="selecione" value="Filme">
  <label for="opcao1">Filme</label>
  <input type="radio" id="opcao2" name="selecione" value="Série">
  <label for="opcao2">Série</label>

        </div>
    <label for="nome">Título do(a) Filme / Série</label>
            <input type="text" id="nome" placeholder="Digite o nome do produto">

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" placeholder="Digite a categoria">

            <label for="preço">Preço</label>
            <input type="number" id="preço" placeholder="Digite o preço">

            <label for="descrição">Descrição</label>
            <textarea id="descrição" placeholder="Digite a descrição do produto"></textarea>

    <p id="mensagemErro"></p>
    </section>
</body>

</html>
